description: >
  Repairs Jellyfin presentation keys so duplicate Series records with matching
  TVDB, TMDB, or IMDb IDs appear as one show, and merges repeated movies and
  episodes into selectable playback versions that can be split apart again.
  Media files and library records are not deleted.
