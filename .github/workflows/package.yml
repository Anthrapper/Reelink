name: Build plugin package

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  package:
    name: Build Jellyfin plugin
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact-name: ${{ steps.artifact.outputs.name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build Jellyfin package
        id: jprm
        uses: oddstr13/jellyfin-plugin-repository-manager@9497a0a499416cc572ed2e07a391d9f943a37b4d # v1.1.1
        with:
          dotnet-target: net10.0

      - name: Read package path
        id: artifact
        shell: bash
        env:
          ARCHIVE: ${{ steps.jprm.outputs.artifact }}
        run: |
          test -f "$ARCHIVE"
          echo "name=$(basename "$ARCHIVE")" >> "$GITHUB_OUTPUT"

      - name: Validate plugin package
        shell: bash
        env:
          ARCHIVE: ${{ steps.jprm.outputs.artifact }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import zipfile

          archive = os.environ["ARCHIVE"]
          expected_files = {"meta.json", "Jellyfin.Plugin.Reelink.dll"}
          with zipfile.ZipFile(archive) as package:
              corrupt_file = package.testzip()
              if corrupt_file:
                  raise SystemExit(f"Package CRC check failed for {corrupt_file}")

              files = {name for name in package.namelist() if not name.endswith("/")}
              if files != expected_files:
                  raise SystemExit(f"Unexpected package contents: {sorted(files)}")

              metadata = json.loads(package.read("meta.json"))
              expected_metadata = {
                  "name": "Reelink",
                  "guid": "56994efb-d240-459a-a992-4000cb41e758",
                  "version": "0.0.1",
                  "targetAbi": "12.0.0.0",
              }
              for key, expected in expected_metadata.items():
                  actual = metadata.get(key)
                  if actual != expected:
                      raise SystemExit(f"Invalid {key}: expected {expected!r}, got {actual!r}")

              dll_size = package.getinfo("Jellyfin.Plugin.Reelink.dll").file_size
              if dll_size == 0:
                  raise SystemExit("Plugin DLL is empty")

          with open(archive, "rb") as stream:
              digest = hashlib.sha256(stream.read()).hexdigest()
          print(f"Validated {archive}: {dll_size} byte DLL, SHA-256 {digest}")
          PY

      - name: Upload package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ${{ steps.jprm.outputs.artifact }}
          if-no-files-found: error
          archive: false

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download plugin package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.package.outputs.artifact-name }}
          path: release

      - name: Publish tagged release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: release/*.zip
          fail_on_unmatched_files: true

  publish-repo:
    name: Publish plugin repository manifest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Download plugin package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.package.outputs.artifact-name }}
          path: release

      - name: Generate repository manifest
        shell: bash
        run: |
          python3 -m venv jprm-venv
          jprm-venv/bin/pip install --quiet jprm
          mkdir -p repo
          jprm-venv/bin/jprm repo init repo
          jprm-venv/bin/jprm repo add \
            --url "https://raw.githubusercontent.com/Anthrapper/Reelink/main" \
            repo "$(ls release/*.zip | head -n 1)"

      - name: Commit and push repository manifest
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo
          if git diff --cached --quiet; then
            echo "Repository manifest unchanged."
          else
            git commit -m "Update plugin repository manifest"
            git push
          fi
